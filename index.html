<script id="supabase-setup" type="text/plain">-- GROUP HUB / SUPABASE SETUP v1
-- Run the full script once in Supabase SQL Editor. It does not change existing business tables.
begin;
create schema if not exists hub_private;
revoke all on schema hub_private from public;
grant usage on schema hub_private to authenticated;
create table if not exists public.hub_profiles (
 id uuid primary key references auth.users(id) on delete cascade,
 email text not null, full_name text not null default '',
 role text not null default 'pending' check(role in ('pending','director','gm','manager','lead')),
 company text check(company in ('mattex','microfinance','leonix')),
 department text not null default '', active boolean not null default false,
 created_at timestamptz not null default now(),
 constraint hub_role_scope check((role in ('pending','director','gm') and company is null) or (role in ('manager','lead') and company is not null)),
 constraint hub_lead_department check(role <> 'lead' or length(trim(department)) > 0)
);
create table if not exists public.hub_items (
 id uuid primary key default gen_random_uuid(), kind text not null check(kind in ('task','approval','goal','report')),
 title text not null check(length(trim(title)) between 1 and 180), description text not null default '' check(length(description)<=5000),
 company text not null check(company in ('mattex','microfinance','leonix')), department text not null default '',
 status text not null check(status in ('todo','in_progress','done','gm','directors','approved','rejected','submitted')),
 priority text not null default 'normal' check(priority in ('normal','high','urgent')),
 assignee uuid references public.hub_profiles(id), due date, amount numeric(16,0) not null default 0 check(amount>=0),
 progress integer not null default 0 check(progress between 0 and 100),
 created_by uuid not null references public.hub_profiles(id), created_at timestamptz not null default now(), updated_at timestamptz not null default now()
);
create table if not exists public.hub_events (
 id uuid primary key default gen_random_uuid(), item_id uuid references public.hub_items(id),
 company text, department text not null default '', actor uuid not null references public.hub_profiles(id),
 actor_name text not null, message text not null, created_at timestamptz not null default now()
);
create index if not exists hub_items_scope_idx on public.hub_items(company,department,created_at desc);
create index if not exists hub_events_item_idx on public.hub_events(item_id,created_at desc);
create or replace function hub_private.actor() returns public.hub_profiles language sql stable security definer set search_path='' as $$ select p from public.hub_profiles p where p.id=auth.uid() and p.active=true and p.role<>'pending'; $$;
create or replace function hub_private.is_group() returns boolean language sql stable security definer set search_path='' as $$ select coalesce((hub_private.actor()).role in ('director','gm'),false); $$;
create or replace function hub_private.can_scope(c text,d text) returns boolean language sql stable security definer set search_path='' as $$ select coalesce(hub_private.is_group() or ((hub_private.actor()).company=c and ((hub_private.actor()).role='manager' or (hub_private.actor()).department=d)),false); $$;
revoke all on function hub_private.actor() from public;
revoke all on function hub_private.is_group() from public;
revoke all on function hub_private.can_scope(text,text) from public;
grant execute on function hub_private.actor(),hub_private.is_group(),hub_private.can_scope(text,text) to authenticated;
create or replace function hub_private.new_user() returns trigger language plpgsql security definer set search_path='' as $$
 begin insert into public.hub_profiles(id,email,full_name) values(new.id,coalesce(new.email,''),left(coalesce(new.raw_user_meta_data->>'full_name',new.email,''),120)) on conflict(id) do nothing; return new; end; $$;

create or replace function public.hub_create(p jsonb) returns uuid language plpgsql security definer set search_path='' as $$
 declare a public.hub_profiles; t public.hub_profiles; i uuid; k text; c text; d text; s text; who uuid;
 begin
 a:=hub_private.actor(); if a.id is null then raise exception 'Akaunti haijaidhinishwa.'; end if;
 k:=p->>'kind'; c:=p->>'company'; d:=coalesce(p->>'department','');
 if not hub_private.can_scope(c,d) then raise exception 'Huna ruhusa kwa kampuni au kitengo hiki.'; end if;
 who:=nullif(p->>'assignee','')::uuid;
 if who is not null then select * into t from public.hub_profiles where id=who and active;
  if t.id is null or (t.role not in ('director','gm') and t.company<>c) or (a.role='lead' and t.department<>a.department) then raise exception 'Mhusika si sahihi.'; end if;
 end if;
 s:=case when k='approval' then case when a.role in ('director','gm') then 'directors' else 'gm' end when k='report' then 'submitted' else 'todo' end;
 insert into public.hub_items(kind,title,description,company,department,status,priority,assignee,due,amount,created_by)
 values(k,trim(p->>'title'),coalesce(p->>'description',''),c,d,s,coalesce(p->>'priority','normal'),who,nullif(p->>'due','')::date,coalesce(nullif(p->>'amount','')::numeric,0),a.id) returning id into i;
 insert into public.hub_events(item_id,company,department,actor,actor_name,message) values(i,c,d,a.id,a.full_name,'Imeongezwa: '||(p->>'title')); return i;
 end; $$;
create or replace function public.hub_update(p_id uuid,p jsonb) returns void language plpgsql security definer set search_path='' as $$
 declare a public.hub_profiles; r public.hub_items; t public.hub_profiles; who uuid; pr int; st text;
 begin
 a:=hub_private.actor(); select * into r from public.hub_items where id=p_id for update;
 if a.id is null or r.id is null or not hub_private.can_scope(r.company,r.department) then raise exception 'Rekodi haipatikani au huna ruhusa.'; end if;
 if r.kind not in ('task','goal') then raise exception 'Tumia hatua sahihi ya rekodi.'; end if;
 if a.role='lead' and r.created_by<>a.id and r.assignee is distinct from a.id then raise exception 'Kazi hii haijakabidhiwa kwako.'; end if;
 st:=p->>'status'; if st not in ('todo','in_progress','done') or st is null then raise exception 'Status si sahihi.'; end if;
 pr:=case when st='done' then 100 else coalesce((p->>'progress')::int,r.progress) end;
 who:=r.assignee;
 if a.role<>'lead' and p ? 'assignee' then who:=nullif(p->>'assignee','')::uuid;
  if who is not null then select * into t from public.hub_profiles where id=who and active;
   if t.id is null or (t.role not in ('director','gm') and t.company<>r.company) then raise exception 'Mhusika si sahihi.'; end if;
  end if;
 end if;
 update public.hub_items set status=st,progress=pr,assignee=who,due=case when a.role<>'lead' and p ? 'due' then nullif(p->>'due','')::date else r.due end,updated_at=now() where id=r.id;
 insert into public.hub_events(item_id,company,department,actor,actor_name,message) values(r.id,r.company,r.department,a.id,a.full_name,'Maendeleo: '||st||' / '||pr||'%');
 end; $$;
create or replace function public.hub_decide(p_id uuid,p_decision text,p_note text) returns void language plpgsql security definer set search_path='' as $$
 declare a public.hub_profiles; r public.hub_items; st text;
 begin
 a:=hub_private.actor(); select * into r from public.hub_items where id=p_id for update;
 if a.id is null or r.id is null or not hub_private.can_scope(r.company,r.department) then raise exception 'Huna ruhusa.'; end if;
 if r.kind<>'approval' or r.status not in ('gm','directors') then raise exception 'Ombi tayari lina uamuzi au si ombi la idhini.'; end if;
 if r.created_by=a.id then raise exception 'Huwezi kuidhinisha ombi lako mwenyewe.'; end if;
 if length(trim(coalesce(p_note,'')))=0 or length(p_note)>2000 then raise exception 'Andika sababu ya uamuzi (hadi herufi 2000).'; end if;
 if r.status='gm' and a.role not in ('gm','director') then raise exception 'Hatua hii ni ya General Manager.'; end if;
 if r.status='directors' and a.role<>'director' then raise exception 'Idhini ya mwisho ni ya Directors.'; end if;
 if p_decision='reject' then st:='rejected';
 elsif p_decision='recommend' and r.status='gm' then st:='directors';
 elsif p_decision='approve' and r.status='directors' then st:='approved';
 else raise exception 'Uamuzi haulingani na hatua ya ombi.'; end if;
 update public.hub_items set status=st,updated_at=now() where id=r.id;
 insert into public.hub_events(item_id,company,department,actor,actor_name,message) values(r.id,r.company,r.department,a.id,a.full_name,'Uamuzi: '||st||'. '||trim(p_note));
 end; $$;
create or replace function public.hub_comment(p_id uuid,p_message text) returns void language plpgsql security definer set search_path='' as $$
 declare a public.hub_profiles; r public.hub_items;
 begin a:=hub_private.actor(); select * into r from public.hub_items where id=p_id;
 if a.id is null or r.id is null or not hub_private.can_scope(r.company,r.department) then raise exception 'Huna ruhusa.'; end if;
 if length(trim(coalesce(p_message,''))) not between 1 and 2000 then raise exception 'Andika maoni (hadi herufi 2000).'; end if;
 insert into public.hub_events(item_id,company,department,actor,actor_name,message) values(r.id,r.company,r.department,a.id,a.full_name,trim(p_message)); end; $$;
create or replace function public.hub_set_member(p_id uuid,p_role text,p_company text,p_department text,p_active boolean) returns void language plpgsql security definer set search_path='' as $$
 declare a public.hub_profiles; t public.hub_profiles; c text; d text;
 begin
 -- Serialize role changes to protect the last active Director.
 perform pg_advisory_xact_lock(7289142);
 a:=hub_private.actor(); if a.id is null or a.role<>'director' then raise exception 'Directors pekee wanaweza kubadili ruhusa.'; end if;
 select * into t from public.hub_profiles where id=p_id for update; if t.id is null then raise exception 'Akaunti haipo. Mtumiaji ajisajili kwanza.'; end if;
 if p_role not in ('pending','director','gm','manager','lead') or p_role is null then raise exception 'Cheo si sahihi.'; end if;
 if t.role='director' and t.active and (p_role<>'director' or not p_active) and (select count(*) from public.hub_profiles where role='director' and active)=1 then raise exception 'Lazima kubaki na Director mmoja active.'; end if;
 c:=case when p_role in ('manager','lead') then p_company else null end;
 d:=case when p_role='lead' then trim(coalesce(p_department,'')) else '' end;
 update public.hub_profiles set role=p_role,company=c,department=d,active=(p_active and p_role<>'pending') where id=p_id;
 insert into public.hub_events(company,department,actor,actor_name,message) values(null,'',a.id,a.full_name,'Ruhusa: '||t.email||' → '||p_role||case when p_active then ' (active)' else ' (inactive)' end);
 end; $$;

function errorText(e){if(!e)return 'Hitilafu isiyotarajiwa.';if(e.message?.includes('Failed to fetch'))return 'Muunganisho umeshindikana. Hakiki internet na Supabase URL.';if(['42P01','PGRST202','PGRST205'].includes(e.code))return 'Tables au functions hazipo. Fungua Maelekezo na uendeshe SQL yote kwenye Supabase.';return e.message||String(e)}

async function connect(url,key){if(!url||!key)return authView('Weka Supabase URL na public key ili kuanza.');if(!/^https:\/\/[^/]+\/?$/.test(url)||!safeKey(key))return authView('Tumia HTTPS Project URL na publishable / anon key pekee.');if(!window.supabase)return authView('Supabase library haijapakia. Hakiki internet kisha reload.');if(subscription)subscription.unsubscribe();if(poll)clearInterval(poll);sb=window.supabase.createClient(url.replace(/\/$/,''),key);subscription=sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==='SIGNED_OUT'){me=null;items=[];members=[];events=[];authView()}else if(s)setTimeout(()=>load(),0)}).data.subscription;const {data,error}=await sb.auth.getSession();if(error)return authView(errorText(error));session=data.session;if(session)await load();else authView();poll=setInterval(()=>{if(session&&document.visibilityState==='visible'&&!$('#modal').open)load(true)},60000)}

async function load(quiet=false){if(!sb||!session||loading)return;loading=true;try{const p=await sb.from('hub_profiles').select('*').eq('id',session.user.id).single();if(p.error)throw p.error;me=p.data;if(!me.active||me.role==='pending'){pendingView();return}const results=await Promise.all([sb.from('hub_items').select('*').order('created_at',{ascending:false}).range(0,999),sb.from('hub_profiles').select('*').order('created_at'),sb.from('hub_events').select('*').order('created_at',{ascending:false}).limit(300)]);results.forEach(r=>{if(r.error)throw r.error});[items,members,events]=results.map(r=>r.data||[]);if(company!=='all'&&!companyKeys().includes(company))company='all';render();if(items.length===1000)toast('Rekodi 1,000 zimepakiwa. Ongeza pagination kabla ya matumizi makubwa.');}catch(e){if(!quiet){if(!me)authView(errorText(e));toast(errorText(e))}}finally{loading=false}}

function setup(){const cfg=config();dialog(`<div class="modalhead"><div><span class="eyebrow">HTML + CSS + JAVASCRIPT + SUPABASE</span><h2>Maelekezo ya kuunganisha</h2></div><button class="iconbtn" data-action="close">✕</button></div><div class="detailbody"><ol class="setupsteps"><li>Unda Supabase project yako. Kwenye SQL Editor, copy na run <b>SQL yote</b> hapa chini. Script inaunda tables zenye prefix <code>hub_</code> na RLS.</li><li>Weka file hili kama <code>index.html</code> kwenye GitHub repository. Washa GitHub Pages (Deploy from branch). Tumia HTTPS URL ya page yako.</li><li>Supabase Authentication → URL Configuration: weka GitHub Pages URL kama Site URL na Redirect URL. Kwa GitHub project pages, jumuisha subpath ya repository.</li><li>Weka Project URL na <b>publishable / anon key</b> hapa au kwenye constants mbili mwanzoni mwa JavaScript. Public key inaweza kuwa kwenye frontend; <b>usiweke service_role au secret key.</b></li><li>Jisajili, thibitisha email ikiwa confirmation imewashwa, kisha ingia. Akaunti inaanza Pending.</li><li>Kwa Director wa kwanza pekee, run bootstrap SQL iliyo chini kwa email halisi. Baadaye Directors wape akaunti nyingine ruhusa kwenye Timu na ruhusa.</li></ol><form id="config-form"><label>Supabase Project URL<input name="url" type="url" placeholder="https://your-project.supabase.co" value="${esc(SUPABASE_URL||cfg.url||'')}" required></label><label>Publishable / anon key<input name="key" type="text" placeholder="sb_publishable_… au legacy anon JWT" value="${esc(SUPABASE_ANON_KEY||cfg.key||'')}" required></label><button type="submit" style="margin-top:16px">Hifadhi na unganisha</button></form><h3 class="historytitle">1. Database setup SQL</h3><button class="outline" data-action="copy-sql">Copy SQL yote</button><textarea class="sqlbox" id="sql-text" readonly rows="12"></textarea><h3 class="historytitle">2. Bootstrap Director wa kwanza</h3><p class="muted">Run hii tofauti baada ya akaunti kujisajili. Badili email kwa akaunti halisi. Hii hufanywa kwenye Supabase SQL Editor, si browser.</p><textarea id="bootstrap-text" class="sqlbox" readonly rows="4"></textarea><button class="outline" data-action="copy-bootstrap">Copy bootstrap SQL</button><div class="notice small">Hili ni toleo la kwanza la coordination: tasks, approvals, goals na reports. Vehicle stock, mikopo ya wateja na accounting ledgers ziongezwe kama modules tofauti baada ya msingi huu kuthibitishwa.</div><p class="muted" style="margin-top:16px">Docs: <a target="_blank" rel="noopener" href="https://supabase.com/docs/guides/database/postgres/row-level-security">Supabase RLS</a> · <a target="_blank" rel="noopener" href="https://supabase.com/docs/guides/auth/managing-user-data">User profiles</a></p></div>`);$('#sql-text').value=$('#supabase-setup').textContent;$('#bootstrap-text').value="update public.hub_profiles\nset role='director', company=null, department='', active=true\nwhere lower(email)=lower('"+(session?.user?.email||'YOUR_REAL_EMAIL').replace(/'/g,"''")+"');"}

function empty(title,kind){return `<div class="empty"><div>◫</div><h3>${esc(title)}</h3><p>Rekodi zitapatikana hapa zikiongezwa na timu.</p>${kind?`<button class="soft" data-action="new" data-kind="${kind}">＋ Ongeza ${KINDS[kind]}</button>`:''}</div>`}
function render(){if(!me?.active)return pendingView();const list=filtered(),tasks=list.filter(r=>r.kind==='task'),pending=list.filter(r=>r.kind==='approval'&&['gm','directors'].includes(r.status)),done=tasks.filter(r=>r.status==='done'),late=tasks.filter(r=>r.status!=='done'&&r.due&&r.due<day());
 $('#app').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><a class="brand" href="#"><div class="brandmark">G<span>·</span></div><div><strong>GROUP HUB</strong><small>OPERATIONS WORKSPACE</small></div></a><div class="workspace"><span class="live"></span> Kampuni tatu · Supabase</div><div class="navlabel">USIMAMIZI WA PAMOJA</div><nav>${NAV.map(([k,l,i])=>`<button class="${page===k?'selected':''}" data-action="nav" data-page="${k}"><span class="navicon">${i}</span>${l}${k==='approval'&&pending.length?`<em>${pending.length}</em>`:''}</button>`).join('')}</nav><div class="sidefoot"><button class="mini-flow" data-action="setup">⚙ Maelekezo na connection</button><div class="profile"><span class="avatar">${esc(me.full_name.slice(0,1)||'U')}</span><div><b>${esc(me.full_name||me.email)}</b><small>${ROLES[me.role]}</small></div><button class="iconbtn" data-action="logout" title="Ondoka">↪</button></div></div></aside><button class="scrim" data-action="menu" aria-label="Funga menyu"></button><main><header class="topbar"><div class="crumb"><button class="mobile-menu" data-action="menu" aria-label="Fungua menyu">☰</button><span>Workspace</span><span>/</span><b>${NAV.find(n=>n[0]===page)?.[1]}</b></div><div class="topright"><span class="private"><span class="live"></span> ${esc(ROLES[me.role])}</span><button class="iconbtn" data-action="refresh" title="Pakia upya">↻</button></div></header><div class="content"><div class="pagehead"><div><div class="eyebrow">KAMPUNI TATU. MWELEKEO MMOJA.</div><h1>${page==='dashboard'?'Picha kamili ya utendaji.':NAV.find(n=>n[0]===page)?.[1]}</h1><p>${page==='dashboard'?'Kazi, maamuzi na maendeleo katika sehemu moja.':page==='team'?'Akaunti, majukumu na mipaka ya kila mtu.':'Panga, fuatilia na uwajibishe kila hatua ya kazi.'}</p></div><div class="headbuttons"><button class="outline" data-action="export">↓ Export CSV</button>${!['team','history','companies'].includes(page)?`<button data-action="new" data-kind="${page in KINDS?page:'task'}">＋ ${page in KINDS?KINDS[page]:'Kazi'} mpya</button>`:''}</div></div><div class="filterbar"><div class="companytabs"><button class="${company==='all'?'active':''}" data-action="company" data-company="all">Kampuni zote</button>${companyKeys().map(k=>`<button class="${company===k?'active':''}" data-action="company" data-company="${k}"><span style="background:${C[k].color}"></span>${C[k].short}</button>`).join('')}</div><label class="search">⌕ <input id="search" aria-label="Tafuta" placeholder="Tafuta kazi au taarifa…" value="${esc(search)}"></label></div><div id="pagebody"></div><footer>GROUP OPERATIONS HUB <span>Mpangilio wa kazi. Uwazi wa maamuzi.</span></footer></div></main></div>`;
 let html='';
 if(page==='dashboard'){html=`<section class="stats">${[['Kazi zilizo wazi',tasks.length-done.length,'Zinaendelea / hazijaanza'],['Maombi yanasubiri',pending.length,'Kwa GM / Directors'],['Zimekamilika',done.length,`${tasks.length?Math.round(done.length/tasks.length*100):0}% ya kazi`],['Deadline zimepita',late.length,'Zinahitaji ufuatiliaji']].map(([a,n,b],i)=>`<div class="stat stat${i}"><div class="stat-top">${a}</div><strong>${n}</strong><small>${b}</small></div>`).join('')}</section><div class="sectionheading"><h2>Biashara zako</h2><button class="textbtn" data-action="nav" data-page="companies">Angalia kampuni →</button></div><section class="companygrid">${companyKeys().filter(k=>company==='all'||k===company).map(k=>{const t=tasks.filter(r=>r.company===k),n=t.filter(r=>r.status==='done').length;return `<button class="companycard" data-action="company-tasks" data-company="${k}"><div class="cohead"><span class="coicon" style="color:${C[k].color};background:${C[k].color}15">◫</span><span>↗</span></div><h3>${C[k].name}</h3><p>${C[k].desc}</p><div class="cocount"><span><b>${t.length}</b> kazi</span><span><b>${pending.filter(r=>r.company===k).length}</b> maombi</span></div><div class="progress"><span style="background:${C[k].color};width:${t.length?n/t.length*100:0}%"></span></div><small>${n} kati ya ${t.length} zimekamilika</small></button>`}).join('')}</section><section class="lowergrid"><div class="panel"><div class="panelhead"><h2>Kazi za kufuatilia</h2><button class="textbtn" data-action="nav" data-page="task">Zote →</button></div>${rows([...late,...tasks.filter(r=>r.status!=='done'&&!late.includes(r))].slice(0,5))}</div><div class="panel flowpanel"><div class="panelhead"><h2>Flow ya maamuzi</h2><span class="tiny">APPROVALS</span></div>${[['01','Manager / Kiongozi wa kitengo','Anaanzisha ombi na maelezo'],['02','General Manager','Anakagua na kupendekeza kwa Directors'],['03','Directors','Idhini ya mwisho au kukataa kwa sababu']].map(([n,t,d])=>`<div class="flowstep"><span>${n}</span><div><b>${t}</b><small>${d}</small></div></div>`).join('')}<div class="flownote">◇ Maombi ya GM huenda moja kwa moja kwa Directors.</div></div></section>`}
 else if(page==='companies'){html=`<div class="companydetails">${companyKeys().filter(k=>company==='all'||k===company).map(k=>`<section class="panel"><div class="panelhead"><div><span class="eyebrow" style="color:${C[k].color}">${C[k].short}</span><h2>${C[k].name}</h2><p>${C[k].desc}</p></div><button class="outline" data-action="new" data-kind="task" data-company="${k}">＋ Kazi mpya</button></div><div class="departmentgrid">${D[k].filter(d=>me.role!=='lead'||d===me.department).map(d=>`<div class="dept"><b>${d}</b><small>${esc(members.filter(m=>m.active&&m.company===k&&m.department===d).map(m=>m.full_name).join(', ')||'Kiongozi hajawekwa')}</small></div>`).join('')}</div></section>`).join('')}</div>`}
 else if(page in KINDS){const a=list.filter(r=>r.kind===page&&(statusFilter==='all'||r.status===statusFilter));html=`<section class="panel"><div class="panelhead"><h2>${KINDS[page]} <span class="count">${a.length}</span></h2><select id="status-filter" aria-label="Chuja status"><option value="all">Status zote</option>${options(STATUS,statusFilter)}</select></div>${rows(a)}</section>`}
 else if(page==='team'){html=`<div class="notice"><div><b>Watumiaji wajisajili kwanza, kisha Director awawezeshe.</b><p>Director / GM: kampuni zote. Manager: kampuni yake. Kiongozi: kitengo chake. Inactive na Pending hawaoni taarifa za biashara.</p></div></div><section class="panel"><div class="panelhead"><h2>Timu ya uongozi</h2><span class="tiny">${members.length} AKAUNTI</span></div><div class="peoplegrid">${members.filter(m=>company==='all'||m.company===company||!m.company).map(m=>`<div class="person"><span class="avatar">${esc(m.full_name.slice(0,1)||'U')}</span><h3>${esc(m.full_name)}</h3><p>${esc(m.email)}</p><span class="rolepill">${ROLES[m.role]}</span><small>${esc(C[m.company]?.name||'Ngazi ya kundi')}${m.department?' · '+esc(m.department):''}</small><span class="memberstate">${m.active?'● Active':'○ Pending / inactive'}</span>${me.role==='director'?`<button class="outline" data-action="member" data-id="${m.id}" style="margin-top:15px;font-size:11px">Weka ruhusa</button>`:''}</div>`).join('')}</div></section>`}
 else if(page==='history'){html=`<section class="panel"><div class="panelhead"><h2>Historia ya matukio</h2><span class="tiny">MATUKIO 300 YA KARIBUNI</span></div>${timeline(events.filter(e=>company==='all'||e.company===company))}</section>`}
 $('#pagebody').innerHTML=html;
}
function timeline(es){return es.length?`<div class="timeline">${es.map(e=>`<div><span class="eventdot"></span><div><b>${esc(e.message)}</b><small>${esc(e.actor_name)} · ${esc(C[e.company]?.short||'GROUP')} · ${fmt(e.created_at)}</small></div></div>`).join('')}</div>`:empty('Hakuna matukio bado')}
function departmentOptions(co,val){const ds=(D[co]||[]).filter(d=>me.role!=='lead'||d===me.department);return `${me.role!=='lead'?'<option value="">Ngazi ya kampuni</option>':''}${ds.map(d=>`<option ${val===d?'selected':''}>${esc(d)}</option>`).join('')}`}
function assigneeOptions(co,val){return `<option value="">Panga baadaye</option>${members.filter(m=>m.active&&(m.company===co||['director','gm'].includes(m.role))&&(me.role!=='lead'||m.department===me.department)).map(m=>`<option value="${m.id}" ${m.id===val?'selected':''}>${esc(m.full_name)} — ${ROLES[m.role]}</option>`).join('')}`}
function createForm(kind,co){co=co|| (company!=='all'?company:companyKeys()[0]);dialog(`<div class="modalhead"><div><span class="eyebrow">WORKSPACE</span><h2>${KINDS[kind]} mpya</h2></div><button class="iconbtn" data-action="close">✕</button></div><form id="create-form"><input type="hidden" name="kind" value="${kind}"><label>Kichwa<input name="title" maxlength="180" required></label><label>Maelezo<textarea name="description" rows="4" maxlength="5000" placeholder="Kazi, matokeo yanayotarajiwa au sababu za ombi…"></textarea></label><div class="formrow"><label>Kampuni<select name="company" id="form-company">${options(Object.fromEntries(companyKeys().map(k=>[k,C[k].name])),co)}</select></label><label>Kitengo<select name="department" id="form-dept" ${me.role==='lead'?'required':''}>${departmentOptions(co,me.department)}</select></label></div><div class="formrow"><label>Mhusika<select name="assignee" id="form-assignee">${assigneeOptions(co,'')}</select></label><label>Deadline<input type="date" name="due"></label></div><div class="formrow"><label>Kipaumbele<select name="priority">${options({normal:'Kawaida',high:'Juu',urgent:'Dharura'},'normal')}</select></label>${kind==='approval'?'<label>Kiasi (TZS)<input type="number" name="amount" min="0" max="9999999999999999" step="1" value="0" required></label>':''}</div>${kind==='approval'?`<div class="notice small">Ombi linapelekwa kwa ${group()?'Directors':'General Manager'}. Hakuna kuidhinisha ombi lako mwenyewe.</div>`:''}<div class="modalactions"><button type="button" class="outline" data-action="close">Ghairi</button><button type="submit">Hifadhi</button></div></form>`)}
function detail(id){const r=byId(id);if(!r)return;activeDetail=id;const canUpdate=['task','goal'].includes(r.kind)&&(me.role!=='lead'||r.created_by===me.id||r.assignee===me.id),canDecide=r.kind==='approval'&&((r.status==='gm'&&group())||(r.status==='directors'&&me.role==='director'));
 dialog(`<div class="modalhead"><div><span class="eyebrow">${C[r.company].short} / ${KINDS[r.kind]}</span><h2>${esc(r.title)}</h2></div><button class="iconbtn" data-action="close">✕</button></div><div class="detailbody">${badge(r.status)}<p class="description">${esc(r.description||'Hakuna maelezo ya ziada.')}</p><dl><div><dt>Mhusika</dt><dd>${esc(person(r.assignee))}</dd></div><div><dt>Deadline</dt><dd>${fmt(r.due)}</dd></div><div><dt>Aliyeanzisha</dt><dd>${esc(person(r.created_by))}</dd></div><div><dt>Kitengo</dt><dd>${esc(r.department||'Ngazi ya kampuni')}</dd></div>${r.kind==='approval'?`<div><dt>Kiasi</dt><dd>${money(r.amount)}</dd></div>`:''}</dl>
 ${canUpdate?`<form id="update-form"><input type="hidden" name="id" value="${r.id}"><div class="formrow"><label>Status<select name="status">${options({todo:STATUS.todo,in_progress:STATUS.in_progress,done:STATUS.done},r.status)}</select></label><label>Maendeleo (%)<input type="number" min="0" max="100" step="1" name="progress" value="${r.progress}" required></label></div>${me.role!=='lead'?`<div class="formrow"><label>Mhusika<select name="assignee">${assigneeOptions(r.company,r.assignee)}</select></label><label>Deadline<input type="date" name="due" value="${esc(r.due||'')}"></label></div>`:''}<button type="submit" style="margin-top:16px">Hifadhi maendeleo</button></form>`:''}
 ${canDecide?(r.created_by===me.id?'<div class="notice small">Ombi lako linahitaji uamuzi wa kiongozi mwingine mwenye mamlaka.</div>':`<form id="decision-form"><h3 class="historytitle">${r.status==='gm'?'Mapendekezo ya General Manager':'Uamuzi wa Directors'}</h3><input type="hidden" name="id" value="${r.id}"><label>Uamuzi<select name="decision">${options(r.status==='gm'?{recommend:'Pendekeza kwa Directors',reject:'Kataa'}:{approve:'Idhinisha',reject:'Kataa'},r.status==='gm'?'recommend':'approve')}</select></label><label>Sababu<textarea name="note" maxlength="2000" rows="3" required></textarea></label><button type="submit" style="margin-top:16px">Wasilisha uamuzi</button></form>`):''}
 <h3 class="historytitle">Historia na maoni</h3>${timeline(events.filter(e=>e.item_id===id))}<form id="comment-form"><input type="hidden" name="id" value="${r.id}"><label>Ongeza maoni<textarea name="message" rows="2" maxlength="2000" required></textarea></label><button type="submit" style="margin-top:14px">Wasilisha maoni</button></form></div>`)}
function memberForm(id){if(me.role!=='director')return;const m=members.find(x=>x.id===id);if(!m)return;roleDraft={id,role:m.role,company:m.company||'mattex',department:m.department,active:m.active};paintMember()}
function paintMember(){const m=members.find(x=>x.id===roleDraft.id),d=roleDraft;const html=`<div class="modalhead"><div><span class="eyebrow">RUHUSA ZA AKAUNTI</span><h2>${esc(m.full_name)}</h2><p class="muted">${esc(m.email)}</p></div><button class="iconbtn" data-action="close">✕</button></div><form id="member-form"><input type="hidden" name="id" value="${m.id}"><label>Cheo<select name="role" id="member-role">${options(ROLES,d.role)}</select></label>${['manager','lead'].includes(d.role)?`<label>Kampuni<select name="company" id="member-company">${options(Object.fromEntries(Object.keys(C).map(k=>[k,C[k].name])),d.company)}</select></label>`:''}${d.role==='lead'?`<label>Kitengo<select name="department" id="member-dept" required>${departmentOptions(d.company,d.department)}</select></label>`:''}<label class="checklabel"><input type="checkbox" name="active" id="member-active" ${d.active?'checked':''}> Akaunti iwe active</label><div class="notice small">Directors na GM wanaona kampuni zote. Mabadiliko yanaanza kutumika kwenye requests zinazofuata; hakuna email inayotumwa.</div><div class="modalactions"><button type="button" class="outline" data-action="close">Ghairi</button><button type="submit">Hifadhi ruhusa</button></div></form>`;if($('#modal').open){$('#modal-body').innerHTML=html;$('#modal-body h2').id='dialog-title'}else dialog(html)}
async function run(form,fn){if(busy)return;busy=true;form.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();busy=false;closeDialog();await load();toast('Imehifadhiwa kikamilifu.')}catch(e){toast(errorText(e))}finally{busy=false;form.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function csv(){const rs=filtered(),headers=['Aina','Kampuni','Kichwa','Status','Mhusika','Deadline','Kiasi TZS','Maendeleo %'];const guard=s=>/^[=+\-@\t\r]/.test(s)?"'"+s:s;const rows=[headers,...rs.map(r=>[KINDS[r.kind],C[r.company].name,r.title,STATUS[r.status],person(r.assignee),r.due||'',r.amount,r.progress])];const v='\uFEFF'+rows.map(r=>r.map(s=>'"'+guard(String(s)).replace(/"/g,'""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([v],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='group-hub-'+day()+'.csv';a.click();URL.revokeObjectURL(u)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const a=b.dataset.action;try{
 if(a==='nav'){page=b.dataset.page;search='';statusFilter='all';render()}
 else if(a==='company'){company=b.dataset.company;render()}
 else if(a==='company-tasks'){company=b.dataset.company;page='task';render()}
 else if(a==='new')createForm(b.dataset.kind,b.dataset.company);
 else if(a==='detail')detail(b.dataset.id);
 else if(a==='member')memberForm(b.dataset.id);
 else if(a==='close')closeDialog();
 else if(a==='refresh')await load();
 else if(a==='logout'){if(sb){const {error}=await sb.auth.signOut();if(error)throw error}session=null;me=null;authView()}
 else if(a==='setup')setup();
 else if(a==='auth-toggle'){authMode=authMode==='login'?'signup':'login';authView()}
 else if(a==='export')csv();
 else if(a==='menu'){$('#sidebar').classList.toggle('open');document.body.classList.toggle('menuopen')}
 else if(a==='copy-sql'||a==='copy-bootstrap'){const t=a==='copy-sql'?$('#sql-text'):$('#bootstrap-text');try{await navigator.clipboard.writeText(t.value);toast('SQL imecopyiwa.')}catch{t.focus();t.select();toast('Chagua Copy / Ctrl+C.')}}
 }catch(err){toast(errorText(err))}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='status-filter'){statusFilter=t.value;render()}
 if(t.id==='form-company'){$('#form-dept').innerHTML=departmentOptions(t.value,'');$('#form-assignee').innerHTML=assigneeOptions(t.value,'')}
 if(t.id==='member-role'||t.id==='member-company'){roleDraft.active=$('#member-active').checked;if($('#member-dept'))roleDraft.department=$('#member-dept').value;if(t.id==='member-role')roleDraft.role=t.value;else{roleDraft.company=t.value;roleDraft.department=''}paintMember()}
});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,p=Object.fromEntries(new FormData(f));
 if(f.id==='config-form'){if(!safeKey(p.key.trim()))return toast('Usitumie secret/service_role key kwenye frontend.');if(!/^https:\/\/[^/]+\/?$/.test(p.url.trim()))return toast('Project URL iwe HTTPS origin bila paths.');localStorage.setItem('group-hub-config',JSON.stringify({url:p.url.trim(),key:p.key.trim()}));closeDialog();await connect(p.url.trim(),p.key.trim());return}
 if(f.id==='auth-form'){if(!sb)return toast('Unganisha Supabase kwanza kupitia Maelekezo.');if(busy)return;busy=true;f.querySelector('button').disabled=true;try{let res;if(authMode==='signup'){res=await sb.auth.signUp({email:p.email,password:p.password,options:{data:{full_name:p.full_name},emailRedirectTo:location.origin+location.pathname}});if(res.error)throw res.error;if(!res.data.session){authMode='login';authView('Akaunti imeombwa. Thibitisha email ikiwa confirmation imewashwa, kisha ingia.')}else{session=res.data.session;await load()}}else{res=await sb.auth.signInWithPassword({email:p.email,password:p.password});if(res.error)throw res.error;session=res.data.session;await load()}}catch(err){toast(errorText(err))}finally{busy=false;f.querySelector('button').disabled=false}return}
 if(!sb||!me?.active)return;
 await run(f,async()=>{let res;
 if(f.id==='create-form')res=await sb.rpc('hub_create',{p});
 else if(f.id==='update-form'){const {id,...values}=p;res=await sb.rpc('hub_update',{p_id:id,p:values})}
 else if(f.id==='decision-form')res=await sb.rpc('hub_decide',{p_id:p.id,p_decision:p.decision,p_note:p.note});
 else if(f.id==='comment-form')res=await sb.rpc('hub_comment',{p_id:p.id,p_message:p.message});
 else if(f.id==='member-form')res=await sb.rpc('hub_set_member',{p_id:p.id,p_role:p.role,p_company:p.company||null,p_department:p.department||'',p_active:new FormData(f).has('active')});
 if(res?.error)throw res.error;
 });
});
$('#modal').addEventListener('cancel',e=>{if(busy)e.preventDefault();else activeDetail=null});
window.addEventListener('online',()=>{if(session)load(true)});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session&&!$('#modal').open)load(true)});
const initial=config();connect(SUPABASE_URL||initial.url,SUPABASE_ANON_KEY||initial.key);
</script></body></html>
